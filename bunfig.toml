[loader]
".md" = "text"

[run]
bun = true

[test]
preload = ["./test/setup.ts"]
coverage = true
coverageReporter = ["text", "lcov"]
coverageThreshold = { line = 1.0, function = 1.0, statement = 1.0 }
# Fixtures are compiled through the plugin at runtime by tests; they are test
# inputs, not code under coverage.
coveragePathIgnorePatterns = ["test/fixtures/**"]
