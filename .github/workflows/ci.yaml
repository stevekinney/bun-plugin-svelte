name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned for reproducibility; bump deliberately (or via Dependabot).
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate
        run: bun run validate

      # `validate` exercises the source tree. This step exercises the packed
      # artifact the way a consumer's bunfig string registration would: install
      # the tarball into a clean directory and assert the default export is a
      # ready BunPlugin object (name + setup), which is the published contract.
      - name: Smoke-test packed plugin
        run: |
          bun pm pack --destination "$RUNNER_TEMP/pack"
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          printf '{"name":"consumer","type":"module","private":true}\n' > package.json
          bun add "$RUNNER_TEMP"/pack/*.tgz svelte
          bun -e "const m = await import('@lostgradient/bun-plugin-svelte'); if (typeof m.default?.setup !== 'function' || typeof m.default?.name !== 'string') throw new Error('default export is not a ready BunPlugin');"
